version: "3.8"
services:
  app:
    build: .
    container_name: tokokita-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_DATABASE=tokokita
      - DB_USERNAME=tokokita
      - DB_PASSWORD=${DB_PASSWORD}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_DEFAULT_REGION=ap-southeast-1
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: tokokita-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=tokokita
      - MYSQL_USER=tokokita
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # Catatan: container db TIDAK dipetakan ke port publik (no "ports:"),
    # sehingga MySQL hanya bisa diakses dari container app lewat jaringan internal Docker.

volumes:
  db_data:
